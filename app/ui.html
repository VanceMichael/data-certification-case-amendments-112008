<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场址补报代办台</title>
<style>
  :root { color-scheme: light; font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif; }
  body { margin: 0; background: #f4f5f7; color: #1f2329; }
  header { background: #1f3a5f; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 6px 0 0; font-size: 13px; opacity: .82; }
  main { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; padding: 16px 24px 48px; align-items: start; }
  section { background: #fff; border: 1px solid #dcdfe4; border-radius: 8px; padding: 16px; }
  section + section { margin-top: 14px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  h3 { font-size: 13px; margin: 14px 0 6px; color: #4a5568; }
  label { display: block; font-size: 13px; margin-bottom: 10px; }
  label span { display: block; margin-bottom: 4px; color: #4a5568; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #c6ccd6; border-radius: 5px; font: inherit; font-size: 13px; background: #fff; }
  button { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 5px; border: 1px solid #1f3a5f; background: #1f3a5f; color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: #1f3a5f; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button + button { margin-left: 8px; }
  .status { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; background: #e8edf5; color: #1f3a5f; }
  .status.warn { background: #fdf0e3; color: #8a4b12; }
  .status.good { background: #e5f2e8; color: #22613a; }
  .status.bad { background: #fbe7e7; color: #8c2222; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .row label { flex: 1 1 140px; margin-bottom: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e6e9ee; vertical-align: top; }
  th { color: #4a5568; font-weight: 500; background: #fafbfc; }
  .muted { color: #6b7280; font-size: 12px; }
  .source { font-size: 12px; color: #4a5568; word-break: break-all; }
  .card { border: 1px solid #e6e9ee; border-radius: 6px; padding: 10px 12px; margin-top: 10px; }
  .card.diff { border-color: #d9a441; background: #fffaf0; }
  .card.deny { border-color: #d47c7c; background: #fdf6f6; }
  code { background: #f1f3f6; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  ol.audit { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  ol.audit li { padding: 5px 0; border-bottom: 1px dashed #e6e9ee; }
  #notice:empty { display: none; }
  #notice { margin: 0 24px; padding: 10px 14px; border-radius: 6px; background: #fff5e5; border: 1px solid #e2b768; font-size: 13px; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; background: #f1f3f6; padding: 8px; border-radius: 5px; margin: 6px 0 0; max-height: 220px; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>场址补报代办台</h1>
  <p>只在浏览器内办理合成联办门户；每一项动作都记录核自哪一页、谁批准、门户接收了哪部分。</p>
</header>
<div id="notice"></div>
<main>
  <div>
    <section>
      <h2>企业提供的变更资料</h2>
      <div id="amendment-form"></div>
      <div class="row" style="margin-top:12px">
        <button id="start">载入资料</button>
        <button id="reset" class="secondary">重置会话</button>
      </div>
      <p class="muted" id="source-line"></p>
    </section>
    <section>
      <h2>办理状态</h2>
      <p><span class="status" id="status-chip">未开始</span></p>
      <p class="muted" id="status-message"></p>
      <h3>操作</h3>
      <div id="actions"></div>
    </section>
  </div>
  <div>
    <section>
      <h2>变更资料从哪一页核到</h2>
      <div id="evidence" class="muted">尚未读取门户。</div>
    </section>
    <section>
      <h2>批准了哪些场址和工序</h2>
      <div id="approval" class="muted">尚无经办人批准。</div>
    </section>
    <section>
      <h2>门户实际接收了哪部分</h2>
      <div id="receipt" class="muted">尚无回执。</div>
    </section>
    <section>
      <h2>剩余事项需要哪位经办人重新确认</h2>
      <div id="remaining" class="muted">尚无剩余事项。</div>
    </section>
    <section>
      <h2>办理记录</h2>
      <ol class="audit" id="audit"></ol>
    </section>
  </div>
</main>
<script type="module" src="/ui.js"></script>
</body>
</html>
